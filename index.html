<!DOCTYPE html>
<html>
<head>
  <!--add article title-->
  <title>AI News Tracker</title>
  <!--display parameters for the boxes for each news type-->
  <style>
    body{font-family: Arial; padding: 30px;}
    .pane {
      display: inline-block;
      padding: 20px;
      margin: 12px;
      border: 3px solid #333;
      cursor: pointer;
      width: 250px;
    }
  </style>
</head>

<h1>AI News Tracker</h1>

<!--create the clickable titled windows for each news type-->  
<div class="pane" onclick="openList('trump_ai_deregulation')">
  Trump AI Deregulation<br>
  <strong id="trump_ai_deregulation">-</strong>
</div>

<div class="pane" onclick="openList('ai_case_law')">
  AI Case Law<br>
  <strong id="ai_case_law">-</strong>
</div>

<div class="pane" onclick="openList('ai_deepfake_scam')">
  AI Deepfake Scams<br>
  <strong id="ai_deepfake_scam">-</strong>
</div>

<!--get the correct json file for each search term-->  
<script>
["trump_ai_deregulation","ai_case_law","ai_deepfake_scam"]
.forEach(name=>{
  fetch(`data/${name}.json`)
    .then(r=>r.json())
    .then(d=>document.getElementById(name).innerText=d.total);
});
function openList(name){
  window.location=`list.html?dataset=${name}`;
}
</script>

</body>
</html>
