<!--Create article header-->
<!DOCTYPE html>
<html>
<head>
  <title>Article List</title>
</head>
<body>

<h1 id="title"></h1>
<ul id="articles"></ul>

<!--start script-->
<script>
const parameters=new URLSearchParams(window.location.search);
const dataset=parameters.get("dataset");
  
/*get the data in the .json files*/
fetch(`data/${dataset}.json`)
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("title").innerText=d.label;
    d.articles.forEach(a=>{
      /*create and add list item for each article*/
      const li=document.createElement("li");
      li.innerHTML=`<a href="${a.url}" target="_blank">${a.title}</a>`;
      document.getElementById("articles").appendChild(li);
    });
  });
</script>
  
</body>
</html>
