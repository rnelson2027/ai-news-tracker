<!--Create article header-->
<!DOCTYPE html>
<html>
<head>
  <title>Article List</title>
</head>
<body>

<h1 id="title"></h1>
<ul id="articles"></ul>

<script>
const parameters=new URLSearchParams(window.location.search);
const dataset=parameters.get("dataset");
  
/*get the .json files that contain the parsed links*/
fetch(`data/${dataset}.json`)
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("title").innerText=d.label;
    d.articles.forEach(a=>{
      /*document page handling*/
      const doc=document.createElement("doc");
      doc.innerHTML=`<a href="${a.url}" target="_blank">${a.title}</a>`;
      document.getElementById("articles").appendChild(doc);
    });
  });
</script>
  
</body>
</html>
